<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — Сладкая мастерская</title>
  <link rel="stylesheet" href="styles/style.css">
  <script defer src="script/script.js"></script>
</head>
<body class="auth-page">
  <button class="theme-toggle auth-theme" type="button">🌙 Тёмная</button>
  <form class="auth-card">
    <h1>Сладкая мастерская</h1>
    <label for="email">Email</label>
    <input id="email" type="email">
    <label for="phone">Телефон</label>
    <input id="phone" type="tel">
    <label for="password">Пароль</label>
    <input id="password" type="password">
    <a class="button" href="index.html">Зарегистрироваться</a>
    <div class="auth-links">
      <span>Уже зарегистрированы?</span>
      <a class="link" href="login.html">Войти</a>
    </div>
  </form>
</body>
</html>
